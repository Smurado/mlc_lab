name: TEIR CI

# Zwei getrennte Jobs: der Autotuner unter Projekt/ und die Wochenaufgaben.
# Sie laufen unabhaengig voneinander, damit ein Fehler in einer Woche nicht die
# Aussage ueber den Autotuner verdeckt.
on:
  push:
    paths:
      - 'Projekt/autotuner/**'
      - 'week*/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'Projekt/autotuner/**'
      - 'week*/**'
      - '.github/workflows/**'
  workflow_dispatch:        # manuell ausloesbar

# Aeltere Laeufe desselben Branches abbrechen, wenn schnell hintereinander
# gepusht wird.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read            # mehr braucht der Workflow nicht

jobs:
  build-and-test:
    # macos-latest ist arm64 -- dieselbe Architektur wie die Referenzmaschine
    # (Apple M4) und wie die Entwicklungsmaschine. Homebrew liegt dort unter
    # /opt/homebrew, daher passen die Pfade im Makefile unveraendert.
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: libomp installieren
        # Der Build nutzt OpenMP ueber -Xpreprocessor -fopenmp und linkt gegen
        # libomp aus /opt/homebrew/opt/libomp (siehe src/Makefile).
        run: brew install libomp

      - name: Werkzeuge protokollieren
        # Hilft beim Nachvollziehen, falls sich ein Ergebnis zwischen zwei
        # Laeufen aendert.
        run: |
          clang++ --version
          uname -m
          brew --prefix libomp

      - name: Build (Compiler-Warnungen sind ein Fehler)
        # Die Kursfolie verlangt ausdruecklich, Warnungen ernst zu nehmen.
        # Statt -Werror (bricht bei jedem Compiler-Update) wird die Ausgabe
        # geprueft: keine Warnung erlaubt, aber die Fehlermeldung bleibt lesbar.
        run: |
          set -o pipefail
          make -C Projekt/autotuner/src 2>&1 | tee build.log
          if grep -qi "warning:" build.log; then
            echo "::error::Build erzeugt Compiler-Warnungen"
            grep -i "warning:" build.log
            exit 1
          fi

      - name: Unit-Tests
        # 7 Suiten: C2-Validator, Messschleife, OOM-Guard, Kernel-Validierung,
        # Einsum, Parser, IR-Passes. Alle deterministisch, keine Messungen.
        run: make -C Projekt/autotuner/src test

      - name: Rauchtest (Ende zu Ende)
        # Prueft, dass Parser -> Codegen -> JIT -> Validierung real zusammen
        # funktionieren. Bewusst OHNE Leistungspruefung.
        run: Projekt/autotuner/eval/smoke_test.sh

      # Bewusst NICHT in der CI: eval/retest_regressions.py und alle Benchmarks.
      # Sie dauern 10+ Minuten, und Messzahlen von einem geteilten Runner sind
      # wertlos -- fremde Last verfaelscht sie. Messungen laufen ausschliesslich
      # lokal auf der idlen Referenzmaschine.

      - name: Build-Log sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

  weeks:
    # Die Wochenaufgaben teilen sich mini_jit (week6/Unary.cpp, week6/Gemm.cpp):
    # Woche 7 und 8 binden dieselben Generatoren ein. Eine Aenderung dort bricht
    # also drei Wochen gleichzeitig, was lokal leicht uebersehen wird.
    #
    # Konkreter Anlass: In Unary.cpp fehlte die Invalidierung des
    # Instruktions-Cache nach dem mprotect. Der Fehler trat nur auf, wenn
    # munmap/mmap eine Adresse wiederverwendete, und war damit nicht
    # reproduzierbar -- genau die Sorte Fehler, die wiederholte Laeufe eher
    # finden als eine einzelne Ausfuehrung von Hand.
    runs-on: macos-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false        # eine kaputte Woche verdeckt die anderen nicht
      matrix:
        include:
          # sme: true = die Tests fuehren SME-Instruktionen aus und brauchen
          # dafuer einen Apple M4 oder neuer. Gebaut wird ueberall, denn der
          # Assembler kennt die Instruktionen unabhaengig von der Hardware.
          - {week: week1,   sme: false}
          - {week: week2,   sme: false}
          - {week: week3-4, sme: true}
          - {week: week5,   sme: true}
          - {week: week6,   sme: true}
          - {week: week7,   sme: true}
          - {week: week8,   sme: true}

    steps:
      - uses: actions/checkout@v4

      - name: Hardware protokollieren
        # Macht im Log nachvollziehbar, ob der Runner SME kann. Ohne diese
        # Ausgabe sieht ein uebersprungener Test aus wie ein bestandener.
        run: |
          sysctl -n machdep.cpu.brand_string || true
          echo "FEAT_SME: $(sysctl -n hw.optional.arm.FEAT_SME 2>/dev/null || echo 'nicht vorhanden')"

      - name: libomp installieren
        # Nur Woche 7 und 8 brauchen OpenMP. Der Schritt ist billig (Bottle) und
        # bleibt einheitlich, statt ihn pro Woche zu verzweigen.
        run: brew install libomp

      - name: Build (Compiler-Warnungen sind ein Fehler)
        # Gleiches Tor wie beim Autotuner: keine Warnung erlaubt, aber die
        # Meldung bleibt lesbar. Alle sieben Wochen bauen aktuell warnungsfrei.
        run: |
          set -o pipefail
          make -C ${{ matrix.week }} 2>&1 | tee build-${{ matrix.week }}.log
          if grep -qi "warning:" build-${{ matrix.week }}.log; then
            echo "::error::${{ matrix.week }} erzeugt Compiler-Warnungen"
            grep -i "warning:" build-${{ matrix.week }}.log
            exit 1
          fi

      - name: Tests
        # Jede Woche hat ein test-Ziel. Sauberer Build plus Tests dauert lokal
        # zwischen 2 s (Woche 7) und 24 s (Woche 2).
        #
        # Ab Woche 3+4 fuehren die Tests SME-Instruktionen aus. SME gibt es erst
        # ab Apple M4; die GitHub-Runner sind aelter. Dort wuerde bereits das
        # erste smstart mit SIGILL abbrechen. Der Build bleibt trotzdem
        # aussagekraeftig -- er hat den fehlerhaften x18-Clobber gefunden.
        run: |
          if [ "${{ matrix.sme }}" = "true" ]; then
            SME=$(sysctl -n hw.optional.arm.FEAT_SME 2>/dev/null || echo 0)
            if [ "$SME" != "1" ]; then
              echo "::notice title=Tests uebersprungen::${{ matrix.week }} braucht SME (Apple M4 oder neuer). Runner: $(sysctl -n machdep.cpu.brand_string 2>/dev/null). Gebaut wurde, ausgefuehrt nicht."
              exit 0
            fi
          fi
          make -C ${{ matrix.week }} test

      - name: Build-Log sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.week }}
          path: build-${{ matrix.week }}.log
          retention-days: 7

      # Bewusst NICHT in der CI: die Benchmark-Ziele (make bench, make run).
      # Messzahlen von einem geteilten Runner sind wertlos, weil fremde Last sie
      # verfaelscht. Gemessen wird ausschliesslich lokal auf der idlen Maschine.
